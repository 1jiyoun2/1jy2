<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f2ea">
  <meta name="description" content="사진과 영상을 따뜻한 홋카이도 겨울 톤으로 보정합니다.">
  <title>Sapporo Milk</title>
  <link rel="stylesheet" href="./styles.css?v=20261108-2">
  <script src="./app.js?v=20261108-2" defer></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">SAPPORO MILK</p>
        <h1>홋카이도 겨울 톤</h1>
      </div>
      <div class="top-actions">
        <button type="button" class="primary-button" id="open-button">파일 열기</button>
        <button type="button" class="ghost-button" id="replace-button" disabled>다른 파일</button>
      </div>
    </header>

    <main class="app-grid">
      <section class="preview-panel">
        <div class="stage" id="drop-zone" tabindex="0" role="button" aria-label="사진 또는 영상을 여기에 놓거나 눌러서 선택">
          <div class="stage-empty" id="stage-empty">
            <div class="empty-icon" aria-hidden="true">✳</div>
            <h2>사진 또는 영상 업로드</h2>
            <p>드래그하거나 파일 열기를 눌러 주세요.</p>
            <button type="button" class="primary-button inline-open" id="inline-open-button">파일 선택</button>
            <small>JPG PNG WEBP HEIC · MP4 MOV WEBM</small>
          </div>

          <div class="stage-media" id="stage-media" hidden>
            <canvas id="result-canvas" aria-label="색감 보정 미리보기"></canvas>
            <canvas id="original-canvas" aria-hidden="true"></canvas>
            <div class="compare-rule" id="compare-rule"><span>⇆</span></div>
            <span class="stage-tag left">원본</span>
            <span class="stage-tag right">보정</span>
          </div>

          <div class="stage-processing" id="stage-processing" hidden>
            <span class="spinner"></span>
            <span id="stage-processing-text">불러오는 중...</span>
          </div>
        </div>

        <div class="toolbar">
          <div class="file-card">
            <span class="file-label">현재 파일</span>
            <strong id="file-info">파일을 올려 주세요</strong>
          </div>
          <div class="toolbar-actions">
            <button class="ghost-button" type="button" id="reset-button" disabled>값 초기화</button>
          </div>
        </div>

        <div class="compare-panel" id="compare-panel" hidden>
          <span>원본</span>
          <input id="compare-slider" type="range" min="0" max="100" value="50" aria-label="원본과 보정본 비교 위치">
          <span>보정</span>
        </div>

        <div class="video-controls" id="video-controls" hidden>
          <button type="button" id="play-button" aria-label="영상 재생 또는 일시정지">▶</button>
          <input type="range" min="0" max="1000" value="0" id="seek-slider" aria-label="영상 재생 위치">
          <span id="video-time">00:00 / 00:00</span>
        </div>
      </section>

      <aside class="control-panel" aria-label="색감 조절">
        <div class="panel-head">
          <h2>톤 조절</h2>
          <p>따뜻한 겨울 느낌으로 자동 보정</p>
        </div>

        <label class="auto-toggle">
          <span>
            <strong>자동 밝기 보정</strong>
            <small>어두우면 밝게, 과밝으면 차분하게</small>
          </span>
          <input id="auto-exposure" type="checkbox" checked>
          <span class="switch" aria-hidden="true"></span>
        </label>

        <div class="control-list">
          <div class="control">
            <div class="control-top"><label for="strength">색감 강도</label><output id="strength-value">88%</output></div>
            <input id="strength" type="range" min="0" max="100" value="88">
          </div>
          <div class="control">
            <div class="control-top"><label for="light">밝기</label><output id="light-value">0</output></div>
            <input id="light" type="range" min="-70" max="70" value="0">
          </div>
          <div class="control">
            <div class="control-top"><label for="warmth">따뜻함</label><output id="warmth-value">+14</output></div>
            <input id="warmth" type="range" min="-50" max="50" value="14">
          </div>
          <div class="control">
            <div class="control-top"><label for="softness">부드러움</label><output id="softness-value">72%</output></div>
            <input id="softness" type="range" min="0" max="100" value="72">
          </div>
          <div class="control">
            <div class="control-top"><label for="grain">입자</label><output id="grain-value">5%</output></div>
            <input id="grain" type="range" min="0" max="40" value="5">
          </div>
        </div>

        <div class="export-panel">
          <div class="format-line"><span id="export-format-label">사진 · JPG 고화질</span><span id="auto-info">AUTO EXPOSURE</span></div>
          <button class="export-button" id="export-button" type="button" disabled>보정본 저장</button>
          <p id="export-status" class="export-status" role="status" aria-live="polite">파일을 올리면 바로 보정됩니다.</p>
          <button type="button" class="stop-button" id="stop-button" hidden>영상 저장 중단</button>
        </div>

        <p class="privacy">파일은 서버로 전송되지 않고 현재 브라우저에서만 처리됩니다.</p>
      </aside>
    </main>
  </div>
  <input type="file" id="file-input" accept="image/*,video/*,.heic,.heif,.mov" hidden>
  <video id="source-video" playsinline preload="auto" muted style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none" aria-hidden="true"></video>
</body>
</html>
