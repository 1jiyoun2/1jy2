<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CLASS BOARD · 수업 참여</title>
<style>
:root{font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;color:#182435;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #e5e9f0;padding:20px max(20px,calc((100vw - 1050px)/2));display:flex;justify-content:space-between;align-items:center}.brand{font-size:22px;font-weight:800;color:#254b92}nav{display:flex;gap:8px}button{cursor:pointer;border:0;border-radius:10px;padding:12px 17px;background:#2459ad;color:white;font-weight:700}button.secondary{background:#e7edf8;color:#254b92}button:disabled{opacity:.5;cursor:not-allowed}main{max-width:1050px;padding:28px 20px;margin:auto}h1{font-size:30px;margin:8px 0}p{color:#657388;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:22px}.card,.panel{background:#fff;border:1px solid #e0e7f0;border-radius:18px;padding:24px;box-shadow:0 8px 24px #2949750a}.card{cursor:pointer}.card:hover{border-color:#92add9}.tag{display:inline-block;color:#255cae;background:#eaf2ff;padding:5px 9px;border-radius:20px;font-size:12px;font-weight:700}label{display:block;font-size:13px;font-weight:700;margin:16px 0 7px}input,textarea{display:block;width:100%;border:1px solid #d7e0eb;border-radius:10px;padding:13px;font:inherit}textarea{min-height:120px;resize:vertical}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.muted{font-size:13px;color:#768398}.notice{background:#fff8e5;border:1px solid #f5dea6;border-radius:12px;padding:14px;font-size:13px;color:#765821;margin-top:15px}.opinions{display:grid;grid-template-columns:repeat(auto-fill,240px);justify-content:start;align-items:start;gap:22px;margin-top:24px}.opinion{width:240px;min-height:190px;height:auto;border-radius:2px;background:var(--note-color,#f9f6e9);padding:19px 18px 23px;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:3px 5px 0 #202d4010,4px 9px 17px #202d4021;position:relative;line-height:1.65}.opinion::after{content:"";position:absolute;top:0;right:0;width:0;height:0;border-top:21px solid #ffffff80;border-left:21px solid transparent;filter:drop-shadow(-1px 2px 1px #00000012)}.opinion strong{display:block;margin-bottom:12px;font-size:15px}.opinion div{font-size:14px;white-space:pre-wrap}.opinion{display:flex;flex-direction:column}.note-body{flex:1}.note-footer{margin-top:20px;padding-top:10px;border-top:1px solid #34405418;color:#7a8190;font-size:10px!important;line-height:1.5;letter-spacing:-.1px;white-space:normal!important}.note-footer span{display:block}@media(max-width:560px){.opinions{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}.opinion{width:100%;min-height:170px;padding:15px 13px 20px}}.fab{position:fixed;right:28px;bottom:28px;width:64px;height:64px;border-radius:50%;font-size:36px;line-height:1;box-shadow:0 8px 24px #193e7480;z-index:12}.overlay{position:fixed;inset:0;background:#17233885;display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}.dialog{width:min(100%,500px);max-height:90vh;overflow:auto;background:white;border-radius:18px;padding:24px;box-shadow:0 14px 42px #14233a55}.wall-header{margin-top:20px}.wall-meta{color:#718096;font-size:14px}.hidden,.overlay.hidden{display:none}@media(max-width:600px){header{padding:16px}.brand{font-size:18px}h1{font-size:24px}.panel,.card{padding:18px}}
</style></head><body>
<header><span class="brand">CLASS BOARD</span><nav><button class="secondary" id="home">수업 목록</button><button class="secondary" id="admin">교사 관리</button></nav></header>
<main><section id="list"><span class="tag">STUDENT BOARD</span><h1>수업 게시판</h1><p>참여할 수업을 선택하고 내 생각을 공유하세요.</p><div class="grid" id="boards"></div></section>
<section id="detail" class="hidden"><button class="secondary" id="back">← 목록으로</button><div class="panel wall-header"><span class="tag">수업 담벼락</span><h1 id="board-title"></h1><p id="board-desc"></p><div class="wall-meta" id="wall-count"></div></div><div class="opinions" id="opinions"></div><button class="fab" id="compose" aria-label="의견 작성" title="의견 작성">+</button></section>
<div class="overlay hidden" id="compose-overlay" role="presentation"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="compose-title"><div class="top"><h2 id="compose-title">의견 작성</h2><button class="secondary" id="close-compose" aria-label="닫기">✕</button></div><label for="student">이름</label><input id="student" maxlength="30" placeholder="이름을 입력하세요"><label for="message">나의 의견</label><textarea id="message" maxlength="2000" placeholder="내 생각과 이유를 작성하세요"></textarea><label style="font-size:12px;font-weight:400"><input id="ip-confirm" type="checkbox" style="display:inline;width:auto;margin-right:6px">접속 IP 기록과 일부 공개 안내를 확인했습니다.</label><button id="submit">의견 제출</button><div class="notice">이름, 의견, 제출 시각과 접속 공인 IP가 기록됩니다. IP는 일부 가려서 공개하며 전체 기록은 관리자만 볼 수 있습니다. 같은 학교 Wi-Fi에서는 공인 IP가 동일할 수 있습니다.</div></div></div>
<section id="teacher" class="hidden"><span class="tag">TEACHER ONLY</span><h1>관리자 대시보드</h1><div class="panel" id="login-panel"><h2>교사 로그인</h2><p>Supabase에 등록된 교사 계정만 사용할 수 있습니다.</p><label for="admin-email">이메일</label><input id="admin-email" type="email" autocomplete="username"><label for="admin-password">비밀번호</label><input id="admin-password" type="password" autocomplete="current-password"><button id="admin-login">로그인</button><p id="login-message" class="muted"></p></div><div id="admin-panel" class="hidden"><div class="top"><h2>게시판 관리</h2><button class="secondary" id="admin-logout">로그아웃</button></div><div class="panel"><h2>새 게시판 만들기</h2><label for="new-title">제목</label><input id="new-title" maxlength="150"><label for="new-desc">질문 · 안내문</label><textarea id="new-desc" maxlength="2000"></textarea><button id="create-board">게시판 생성</button></div><div class="panel" style="margin-top:18px"><h2>기존 게시판</h2><div id="admin-boards"></div></div></div></section></main>
<script>
const API="https://jdlgisxjtuebunldjlyn.supabase.co/rest/v1";
const KEY="sb_publishable_6xGQBu9HiVI4A4kj97XfdQ_ponmF0UP";
const $=id=>document.getElementById(id);
const screens=["list","detail","teacher"];
const colors=["#f9f6e9","#f8eff1","#eef5f7","#f0f6ed","#f3f0f8","#faf2eb","#edf6f3","#f7f0f5"];
let boards=[],activeBoard=null,refreshHandle=null,sessionToken=null;
const headers={"apikey":KEY,"Content-Type":"application/json"};
const localDate=date=>new Intl.DateTimeFormat("sv-SE",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}).format(new Date(date));
function text(tag,value,cls){const e=document.createElement(tag);e.textContent=value;if(cls)e.className=cls;return e}
async function query(endpoint,options={}){const r=await fetch(API+endpoint,{...options,headers:{...headers,...(options.headers||{})}});if(!r.ok){let message="서버 요청 실패 ("+r.status+")";try{const d=await r.json();message=d.message||message}catch{}throw Error(message)}if(r.status===204||r.status===201)return null;const raw=await r.text();return raw?JSON.parse(raw):null}
function show(id){$("compose-overlay").classList.add("hidden");screens.forEach(s=>$(s).classList.toggle("hidden",s!==id));if(id!=="detail")stopRefresh();window.scrollTo(0,0)}
function stopRefresh(){if(refreshHandle){clearInterval(refreshHandle);refreshHandle=null}}
function makeNote(p){const c=text("article","","opinion");const seed=[...(p.id||p.author_name+p.body)].reduce((a,ch)=>((a*31+ch.charCodeAt(0))>>>0),17);c.style.setProperty("--note-color",colors[seed%colors.length]);const footer=text("div","","note-footer");footer.append(text("span","IP: "+(p.masked_ip||"확인 불가")),text("span","제출: "+localDate(p.created_at)));c.append(text("strong",p.author_name),text("div",p.body,"note-body"),footer);return c}
async function loadBoards(){try{boards=await query("/boards?select=id,title,description,status,created_at&status=neq.hidden&order=created_at.desc");renderList()}catch(e){$("boards").replaceChildren(text("p","게시판을 불러오지 못했습니다: "+e.message))}}
function renderList(){$("boards").replaceChildren();if(!boards.length){$("boards").append(text("p","현재 표시할 게시판이 없습니다."));return}boards.forEach(b=>{const c=text("article","","card");c.append(text("span",b.status==="open"?"참여 가능":"마감","tag"),text("h2",b.title),text("p",b.description));c.tabIndex=0;c.setAttribute("role","button");c.onclick=()=>openBoard(b.id);c.onkeydown=e=>{if(e.key==="Enter")openBoard(b.id)};$("boards").append(c)})}
async function loadPosts(boardId){try{const posts=await query("/posts?select=id,author_name,body,created_at,masked_ip&board_id=eq."+encodeURIComponent(boardId)+"&order=created_at.asc&limit=1000");if(!activeBoard||activeBoard.id!==boardId)return;const scrolled=window.scrollY;$("opinions").replaceChildren(...posts.map(makeNote));$("wall-count").textContent="의견 "+posts.length+"개 · 전체 공개";if(scrolled>0)window.scrollTo(0,scrolled)}catch(e){$("wall-count").textContent="의견 로드 오류: "+e.message}}
async function openBoard(id){let b=boards.find(x=>x.id===id);if(!b){await loadBoards();b=boards.find(x=>x.id===id)}if(!b)return;activeBoard=b;$("board-title").textContent=b.title;$("board-desc").textContent=b.description;$("compose").disabled=b.status!=="open";$("compose").style.display=b.status==="open"?"":"none";$("opinions").replaceChildren();$("wall-count").textContent="의견을 불러오는 중...";show("detail");if(location.hash!=="#board/"+id)history.replaceState(null,"","#board/"+id);await loadPosts(id);stopRefresh();refreshHandle=setInterval(()=>{if(activeBoard&&activeBoard.id===id&&!$("detail").classList.contains("hidden"))loadPosts(id)},10000)}
function closeCompose(){$("compose-overlay").classList.add("hidden");$("compose").focus()}
$("compose").onclick=()=>{$("student").value="";$("message").value="";$("compose-overlay").classList.remove("hidden");$("student").focus()};
$("close-compose").onclick=closeCompose;
$("compose-overlay").addEventListener("click",e=>{if(e.target===$("compose-overlay"))closeCompose()});
window.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("compose-overlay").classList.contains("hidden"))closeCompose()});
$("submit").onclick=async()=>{const author_name=$("student").value.trim(),body=$("message").value.trim();if(!author_name||!body){alert("이름과 의견을 입력하세요.");return}if(!$("ip-confirm").checked){alert("IP 기록 안내를 확인해 주세요.");return}if(!activeBoard)return;const btn=$("submit");btn.disabled=true;try{await query("/posts",{method:"POST",headers:{"Prefer":"return=minimal"},body:JSON.stringify({board_id:activeBoard.id,author_name,body})});closeCompose();await loadPosts(activeBoard.id)}catch(e){alert("제출 실패: "+e.message)}finally{btn.disabled=false}};

const authUrl="https://jdlgisxjtuebunldjlyn.supabase.co/auth/v1";
async function adminApi(endpoint,options={}){if(!sessionToken)throw Error("관리자 로그인이 필요합니다.");return query(endpoint,{...options,headers:{Authorization:"Bearer "+sessionToken,...(options.headers||{})}})}
async function checkAdmin(){const users=await adminApi("/board_admins?select=user_id&limit=1");return Array.isArray(users)&&users.length===1}
async function showAdmin(){show("teacher");$("login-panel").classList.remove("hidden");$("admin-panel").classList.add("hidden");if(sessionToken){try{if(await checkAdmin()){$("login-panel").classList.add("hidden");$("admin-panel").classList.remove("hidden");await listAdminBoards()}}catch{sessionToken=null}}}
async function listAdminBoards(){const all=await adminApi("/boards?select=id,title,description,status,created_at&order=created_at.desc");$("admin-boards").replaceChildren();all.forEach(b=>{const item=document.createElement("div");item.style.cssText="padding:12px 0;border-bottom:1px solid #e5e9f0";item.append(text("strong",b.title),text("p",b.status==="open"?"진행 중":b.status==="closed"?"마감":"비공개"));const status=document.createElement("select");["open","closed","hidden"].forEach(v=>{const opt=document.createElement("option");opt.value=v;opt.textContent=({open:"공개·제출 가능",closed:"마감",hidden:"비공개"})[v];opt.selected=v===b.status;status.append(opt)});status.onchange=async()=>{try{await adminApi("/boards?id=eq."+b.id,{method:"PATCH",headers:{"Prefer":"return=minimal"},body:JSON.stringify({status:status.value})});await listAdminBoards();await loadBoards()}catch(e){alert(e.message)}};const exp=document.createElement("button");exp.className="secondary";exp.textContent="CSV 다운로드";exp.style.marginLeft="8px";exp.onclick=async()=>{try{const posts=await adminApi("/posts?select=author_name,body,created_at,post_metadata(ip_address)&board_id=eq."+b.id+"&order=created_at.asc&limit=10000");const esc=v=>'"'+String(v??"").replaceAll('"','""')+'"';const content="\uFEFF"+[["이름","의견","제출일시","전체 IP"],...posts.map(p=>[p.author_name,p.body,localDate(p.created_at),p.post_metadata?.ip_address||"미기록"])].map(row=>row.map(esc).join(",")).join("\r\n");const blob=new Blob([content],{type:"text/csv;charset=utf-8"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="class-board-"+b.id+".csv";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){alert(e.message)}};const del=document.createElement("button");del.className="secondary";del.textContent="삭제";del.style.marginLeft="8px";del.onclick=async()=>{if(!confirm("게시판과 모든 학생 글이 영구 삭제됩니다. 삭제할까요?"))return;try{await adminApi("/boards?id=eq."+b.id,{method:"DELETE"});await listAdminBoards();await loadBoards()}catch(e){alert(e.message)}};item.append(status,exp,del);$("admin-boards").append(item)})}
$("admin-login").onclick=async()=>{const email=$("admin-email").value.trim(),password=$("admin-password").value;if(!email||!password)return;const btn=$("admin-login");btn.disabled=true;try{const r=await fetch(authUrl+"/token?grant_type=password",{method:"POST",headers,body:JSON.stringify({email,password})});const d=await r.json();if(!r.ok)throw Error(d.error_description||d.msg||"로그인 실패");sessionToken=d.access_token;if(!(await checkAdmin())){sessionToken=null;throw Error("관리자 권한이 등록되지 않은 계정입니다.")}await showAdmin()}catch(e){$("login-message").textContent=e.message}finally{btn.disabled=false}};
$("admin-logout").onclick=()=>{sessionToken=null;$("admin-password").value="";showAdmin()};
$("create-board").onclick=async()=>{const title=$("new-title").value.trim(),description=$("new-desc").value.trim();if(!title){alert("제목을 입력하세요.");return}try{await adminApi("/boards",{method:"POST",headers:{"Prefer":"return=minimal"},body:JSON.stringify({title,description})});$("new-title").value="";$("new-desc").value="";await listAdminBoards();await loadBoards()}catch(e){alert(e.message)}};
function goHome(){activeBoard=null;show("list");history.replaceState(null,"",location.pathname);loadBoards()}
$("home").onclick=$("back").onclick=goHome;
$("admin").onclick=()=>{activeBoard=null;history.replaceState(null,"","#admin");showAdmin()};
window.addEventListener("hashchange",()=>route());
async function route(){if(location.hash==="#admin"){await showAdmin();return}if(location.hash.startsWith("#board/")){await openBoard(location.hash.slice(7));return}show("list");await loadBoards()}
route();
</script></body></html>
