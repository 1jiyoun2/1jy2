<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>문제 | Coding Practice</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js"></script>
</head>
<body>
<main>
    <p class="back"><a id="back-link" href="python/basic/">← 문제 목록</a></p>
    <h1 id="problem-title">문제를 불러오는 중...</h1>
    <p class="subtitle" id="problem-subtitle"></p>

    <div class="problem-meta" id="problem-meta"></div>

    <h2>문제</h2>
    <p id="description"></p>

    <h2>입력</h2>
    <p id="input-desc"></p>

    <h2>출력</h2>
    <p id="output-desc"></p>

    <h2>예제</h2>
    <div id="examples"></div>

    <div class="editor-label">코드</div>
    <textarea id="code" spellcheck="false"></textarea>

    <div class="editor-label">직접 입력</div>
    <textarea id="stdin" spellcheck="false"></textarea>

    <div class="toolbar">
        <button id="run-btn" disabled>실행</button>
        <button id="judge-btn" disabled>채점</button>
        <button id="reset-btn">초기화</button>
    </div>

    <div class="editor-label">실행 결과</div>
    <div id="output">Python 실행 환경을 준비하는 중입니다...</div>

    <div class="editor-label">채점 결과</div>
    <div id="judge-result">아직 채점하지 않았습니다.</div>

    <p class="note">현재 채점은 브라우저에서 공개 테스트를 실행하는 연습용 방식입니다.</p>
</main>
<script src="runner.js"></script>
</body>
</html>
