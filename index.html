<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Teaching Archive</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, "Malgun Gothic", sans-serif;
            background: #f6f7fb;
            color: #20243a;
        }
        main {
            max-width: 920px;
            margin: 0 auto;
            padding: 56px 24px 80px;
        }
        h1 {
            margin-bottom: 8px;
            font-size: 2.6rem;
        }
        .subtitle {
            margin-top: 0;
            color: #666b7a;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
            margin-top: 36px;
        }
        .card {
            display: block;
            padding: 22px;
            border-radius: 14px;
            background: #fff;
            color: inherit;
            text-decoration: none;
            box-shadow: 0 4px 16px rgba(0,0,0,.06);
        }
        .card:hover {
            transform: translateY(-2px);
        }
        .card h2 {
            margin: 0 0 8px;
            font-size: 1.2rem;
        }
        .card p {
            margin: 0;
            color: #666b7a;
            line-height: 1.6;
        }
    </style>
</head>
<body>
<main>
    <h1>Teaching Archive</h1>
    <p class="subtitle">Programming · Computer Science · AI</p>

    <div class="grid">
        <a class="card" href="courses/programming/2026-grade2/">
            <h2>2026 2학년 프로그래밍</h2>
            <p>수업 설계와 학습 자료를 정리하는 현재 수업 아카이브</p>
        </a>

        <a class="card" href="courses/ai-basics/summary.html">
            <h2>인공지능 기초</h2>
            <p>인공지능 개념, 활용 사례, 모델 실습 자료</p>
        </a>

        <a class="card" href="courses/c-programming/function.html">
            <h2>C Programming</h2>
            <p>함수, 배열, 포인터 등 C 언어 문법 수업 자료</p>
        </a>

        <a class="card" href="courses/database/">
            <h2>Database</h2>
            <p>데이터베이스와 SQL 수업 자료</p>
        </a>

        <a class="card" href="courses/web-programming/">
            <h2>Web Programming</h2>
            <p>HTML과 CSS 기초 수업 자료</p>
        </a>
    </div>
</main>
</body>
</html>
