<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Teaching Archive</title>
    <style>
        :root {
            color-scheme: light;
        }

        body {
            margin: 0;
            font-family: "Malgun Gothic", Arial, sans-serif;
            background: #ffffff;
            color: #202124;
        }

        main {
            max-width: 980px;
            margin: 0 auto;
            padding: 48px 28px 80px;
        }

        h1 {
            margin: 0;
            font-size: 30px;
            font-weight: 700;
        }

        .subtitle {
            margin: 8px 0 34px;
            color: #6b7280;
            font-size: 14px;
        }

        h2 {
            margin: 30px 0 10px;
            font-size: 17px;
            font-weight: 700;
        }

        .list {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            border-top: 1px solid #d8dbe2;
            border-bottom: 1px solid #d8dbe2;
        }

        .list th,
        .list td {
            padding: 10px 12px;
            text-align: left;
            vertical-align: middle;
            border-bottom: 1px solid #eceef2;
            font-size: 14px;
        }

        .list th {
            background: #f7f7f8;
            color: #4b5563;
            font-weight: 600;
        }

        .list tr:last-child td {
            border-bottom: 0;
        }

        .list tbody tr:hover {
            background: #f5f8fc;
        }

        .name {
            width: 34%;
        }

        .description {
            width: 66%;
            color: #5f6368;
        }

        a {
            color: #1f4f8a;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        @media (max-width: 640px) {
            main {
                padding: 32px 16px 56px;
            }

            .name {
                width: 42%;
            }

            .description {
                width: 58%;
            }
        }
    </style>
</head>
<body>
<main>
    <h1>Teaching Archive</h1>
    <p class="subtitle">Programming · Computer Science · AI</p>

    <h2>Courses</h2>

    <table class="list">
        <thead>
            <tr>
                <th class="name">이름</th>
                <th class="description">내용</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><a href="courses/programming/2026-grade2/">2026 2학년 프로그래밍</a></td>
                <td class="description">수업 설계 · 학습 자료 · 수행평가 · 수업 기록</td>
            </tr>
            <tr>
                <td><a href="courses/ai-basics/summary.html">인공지능 기초</a></td>
                <td class="description">인공지능 개념 · 활용 사례 · 모델 실습</td>
            </tr>
            <tr>
                <td><a href="courses/c-programming/function.html">C Programming</a></td>
                <td class="description">함수 · 배열 · 포인터</td>
            </tr>
            <tr>
                <td><a href="courses/database/">Database</a></td>
                <td class="description">데이터베이스 · SQL</td>
            </tr>
            <tr>
                <td><a href="courses/web-programming/">Web Programming</a></td>
                <td class="description">HTML · CSS</td>
            </tr>
        </tbody>
    </table>
</main>
</body>
</html>
